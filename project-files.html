<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARCHGEN - Project File Library</title>

    <link
        rel="stylesheet"
        href="project-files.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

<div class="app">

    <!-- BACK -->

    <button
        type="button"
        class="back-btn"
        onclick="goToProjectPortal()"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Back to Project Portal
    </button>


    <!-- HEADER -->

    <header class="topbar">

        <div>

            <div class="eyebrow">
                ARCHITECTURAL PROJECT MANAGEMENT SYSTEM
            </div>

            <h1>
                PROJECT FILE LIBRARY
            </h1>

            <p>
                Compile floor plans, sketches, presentations,
                documents and rendered perspectives.
            </p>

        </div>


        <div class="project-box">

            <label>
                PROJECT ID
            </label>

            <input
                id="projectId"
                type="text"
                placeholder="PRJ-001"
            >

        </div>

    </header>


    <!-- TOOLBAR -->

    <section class="toolbar">

        <div>

            <h2>
                Project Attachments
            </h2>

            <span id="fileCount">
                0 files
            </span>

        </div>


        <div class="toolbar-actions">

            <label
                class="upload-btn"
                for="fileInput"
            >
                <i class="fa-solid fa-plus"></i>
                Add Files
            </label>


            <input
                id="fileInput"
                type="file"
                accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.ppt,.pptx,.doc,.docx"
                multiple
            >


            <button
                id="clearAll"
                class="danger-btn"
                type="button"
            >
                <i class="fa-solid fa-trash"></i>
                Clear Project
            </button>

        </div>

    </section>


    <!-- FILTERS -->

    <section class="category-bar">

        <button
            class="filter active"
            data-filter="all"
        >
            ALL
        </button>

        <button
            class="filter"
            data-filter="floor-plan"
        >
            FLOOR PLANS
        </button>

        <button
            class="filter"
            data-filter="sketch"
        >
            SKETCHES
        </button>

        <button
            class="filter"
            data-filter="rendered"
        >
            RENDERED PERSPECTIVES
        </button>

        <button
            class="filter"
            data-filter="presentation"
        >
            PRESENTATIONS
        </button>

        <button
            class="filter"
            data-filter="document"
        >
            DOCUMENTS
        </button>

    </section>


    <!-- FILES -->

    <main>

        <div
            id="emptyState"
            class="empty"
        >

            <div class="empty-icon">
                <i class="fa-solid fa-folder-open"></i>
            </div>

            <h3>
                No project files yet
            </h3>

            <p>
                Add architectural files to create
                this project's visual library.
            </p>

        </div>


        <div
            id="fileGrid"
            class="file-grid"
        ></div>

    </main>

</div>


<!-- =====================================================
     VIEWER
     ===================================================== -->

<div
    id="viewer"
    class="viewer"
    aria-hidden="true"
>

    <button
        id="closeViewer"
        class="viewer-close"
        type="button"
    >
        ×
    </button>


    <div class="viewer-content">

        <div class="viewer-head">

            <div>

                <span
                    id="viewerCategory"
                    class="viewer-category"
                ></span>

                <h2
                    id="viewerTitle"
                ></h2>

                <small
                    id="viewerInfo"
                ></small>

            </div>


            <div class="viewer-actions">

                <button
                    id="prevFile"
                    type="button"
                >
                    ‹
                </button>

                <span id="viewerPosition">
                    1 / 1
                </span>

                <button
                    id="nextFile"
                    type="button"
                >
                    ›
                </button>

                <button
                    id="downloadFile"
                    type="button"
                >
                    <i class="fa-solid fa-download"></i>
                    Download
                </button>

            </div>

        </div>


        <div
            id="viewerStage"
            class="viewer-stage"
        ></div>

    </div>

</div>


<script src="project-files.js"></script>

</body>

</html>
